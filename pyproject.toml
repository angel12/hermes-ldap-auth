[project]
name = "hermes-ldap-auth"
version = "1.0.0"
description = "LDAP / Active Directory password login for the Hermes Agent web dashboard"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
authors = [{ name = "angel12" }]
# Hermes's package manager installs these into the Hermes environment when
# the plugin is enabled. ldap3 is pure Python (works on Windows and Termux).
dependencies = [
  "ldap3>=2.9.1,<3",
]

[project.urls]
Homepage = "https://github.com/angel12/hermes-ldap-auth"

